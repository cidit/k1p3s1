
[env:main]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps = 
	adafruit/Adafruit INA219@^1.2.3
	z3t0/IRremote@^4.7.1
	etlcpp/Embedded Template Library@^20.49.0
	technophyscal/TGP Decodeur@^2.0.0
build_flags = -D ETL_NO_STL
